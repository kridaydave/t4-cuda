# =============================================================================
# GLOBAL PASS RULE
# =============================================================================
global_pass_rule:
  description: >
    Overall suite CONFIRMS only if every 'kernel_ready' hypothesis passes ALL its
    gating criteria. 'sim_only' hypotheses are reported as NOT_MEASURABLE (they
    inform the paper's known-limitations section, they do not block the run).
  blocking_capabilities: ["kernel_ready"]
  non_blocking_capabilities: ["sim_only", "math_verified"]
