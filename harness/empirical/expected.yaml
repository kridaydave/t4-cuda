# =============================================================================
# Expected Values Manifest — T4 CUDA Empirical Validation (H4 / H7 / H9 family)
#
# Every entry here is a QUANTITATIVE claim extracted from findings.md,
# research-state.yaml, experiments/*/protocol.md, and experiments/*/analysis.md.
# run_empirical.py measures each, applies `criterion` with `tolerance`, and
# marks the hypothesis CONFIRM / MARGIN / FAIL accordingly.
#
# Statuses:
#   kernel_ready   -> real CUDA kernel exists in src/, can be measured on GPU
#   math_verified  -> bit-exact numerics proven; runs as Python reference check
#   sim_only       -> NO CUDA kernel exists yet; can only report "not measurable"
# =============================================================================

