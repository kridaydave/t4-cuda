  - id: "H17"
    name: "Fused INT3 Dequant + Warp-Specialized GEMV Mega-Kernel"
    status: "PROPOSED"
    target_metric: "2.5-4.5x decode speedup vs NF4 BitsAndBytes baseline on T4"
    rationale: "Combine H7 (INT3 LOP3 dequant) + H8 (producer/consumer warp split) into a single fused decode kernel. Producer warps fetch packed INT3 weights and LOP3-dequant to FP16 in SMEM. Consumer warps run WMMA. Eliminates all intermediate DRAM traffic."
    predecessors: ["H7", "H8"]
    reference: "Marlin kernel architecture (async dequant inside GEMM mainloop)"

