    status: "PROPOSED"
    target_metric: "Fully on-GPU W1.58A4 decode path; end-to-end >= 2x bitnet.cpp TL2 CPU throughput per watt on T4"
    rationale: "BitNet a4.8 defines the W1.58A4 serving regime; bitnet.cpp (2410.16144) and T-MAC (2407.00088) are CPU-only; Intel's 2-bit GPU GEMM is Xe-only. No CUDA W1.58A4 kernel exists. Activations unpack via H4's INT4 LOP3 path; weights via H23's sign/mask bitplanes; products via popcount with INT4-nibble operand accumulation. Compute-by-logic-ops beats compute-by-lookup where SMEM LUT bandwidth is scarce."
