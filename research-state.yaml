    name: "1.58-Bit Ternary Bit-Serial LOP3 Accumulation"
    status: "SIMULATED_AND_FORMALLY_PROVED"
    target_metric: "10.13x VRAM compression, 4 SASS ops per 32 weights"
    rationale: "Decompose ternary weights {-1, 0, 1} into Sign (S) and Mask (M) bitplanes. Use single-cycle lop3.b32 with LUT 0x44 (positive plane) and LUT 0x88 (negative plane) + popcount to evaluate 32-element dot products in 4 SASS instructions."
